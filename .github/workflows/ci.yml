name: Project Fusion CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    build-and-test:
        runs-on: ubuntu-latest

        env:
            CI: true

        strategy:
            matrix:
                node:
                    - 18
                    - 20
        permissions:
            contents: read
            actions: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run test:unit
